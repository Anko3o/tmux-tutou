# ── 兔牙家 tmux 主题 v2（小雾 2026-08-21，安可许愿的「新版本适配」）──────
# v1 是 07-31 的纯配色版；v2 加了三件会说话的东西，仍然零插件、零依赖。
# 改完生效：tmux source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # 开真彩色，粉色才不会掉档变土

set -g status-style "bg=#f6e3ec,fg=#8a5f72"
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# ── 左：兔头衔着会话名，后面跟一个窗口数 ──
#    3 就是三个窗口。数字变大而你没印象，多半是有窗口用完没关（`songtu` 能点名）。
set -g status-left-length 40
set -g status-left "#[bg=#c2708a,fg=#fff6fa,bold] 🐰 #S #[bg=#e9c8d8,fg=#7d4a60] #{session_windows} #[bg=#f6e3ec,fg=#c2708a]"

# ── 窗口标签：前面一个小记号，告诉你这格里跑着什么 ──
#    ✦ = claude 在跑（有人在里面干活）  ✎ = 编辑器  ▸ = 别的命令  · = 空的 shell
#    全是单宽字符，手机终端和网页终端都不会掉字、不会错位。
setw -g window-status-format "#[fg=#b3849a] #{?#{==:#{pane_current_command},claude},✦,#{?#{||:#{==:#{pane_current_command},vim},#{==:#{pane_current_command},nano}},✎,#{?#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},zsh}},·,▸}}} #I:#W "
setw -g window-status-current-format "#[bg=#f2b8ce,fg=#6b3a4e,bold] #{?#{==:#{pane_current_command},claude},✦,#{?#{||:#{==:#{pane_current_command},vim},#{==:#{pane_current_command},nano}},✎,#{?#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},zsh}},·,▸}}} #I:#W "
setw -g window-status-separator ""

# ── 右：可用内存 + 日期时间 + 主机名 ──
#    这台机 3.9G，一只 claude 就吃 600M+，所以把余量摆在眼前。
#    余量 <800M 前面多一颗 ●，别等到卡住才发现。取数的脚本是 /root/.tmux-mem.sh。
#    坑（8-21 实测）：#{?条件,A,B} 的分支里**既不能放 #()，也不能放 #[样式]** ——
#    前者不会被执行、那格永远空，后者会被当成普通文字打出来。所以这里不做宽窄切换。
#    嫌窄就把 #h 删掉，你只有一台机，主机名没什么信息量。
set -g status-right-length 60
set -g status-right "#[fg=#b3849a]#(/root/.tmux-mem.sh) %m-%d #[fg=#8a5f72,bold]%H:%M #[bg=#e9c8d8,fg=#7d4a60] #h "

set -g pane-border-style "fg=#e6c3d3"
set -g pane-active-border-style "fg=#c2708a"
set -g message-style "bg=#c2708a,fg=#fff6fa,bold"

# ── 顺手的小舒适（不改按键习惯）──
# set -g mouse on            # ← 故意关着：开了会抢走鼠标拖选，安可复制不了（7-31 实测，别再手滑打开）
setw -g aggressive-resize on # 两个客户端同挂一只会话时按「正在看的那个」调宽度，避免重绘错位
set -g history-limit 50000
set -sg escape-time 10
set -g renumber-windows on
